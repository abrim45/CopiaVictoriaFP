  <image href="/img/logo.png" x="170" y="420" width="120" height="145"/>
  <text x="300" y="520" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="700" fill="#2b2f33">Victoria</text>
  <text x="300" y="560" font-family="Montserrat, Arial, sans-serif" font-size="28" fill="#2b2f33">Institute of Technology</text>
  <circle cx="290" cy="720" r="70" fill="#2b3036"/>
  <circle cx="290" cy="720" r="55" fill="#4a5560"/>
  <!-- Lona -->
  <polygon points="560,470 1150,580 1150,800 560,700" fill="#5fa9e6"/>
  <text x="640" y="610" font-family="Montserrat, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" transform="rotate(10 640 610)">la FP de tu</text>
  <text x="640" y="665" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" transform="rotate(10 640 665)">FUTURO</text>
  <!-- Ventanas -->
