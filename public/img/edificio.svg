<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a6b"/>
      <stop offset="1" stop-color="#3f7fd0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#e3e6ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1100" fill="url(#sky)"/>
  <!-- Edificio genérico (ilustración provisional: sustituir por public/img/edificio.jpg) -->
  <polygon points="110,250 1200,520 1200,1000 110,1000" fill="url(#wall)"/>
  <polygon points="520,170 900,110 900,330 520,380" fill="#ffffff"/>
  <polygon points="900,110 1200,190 1200,420 900,330" fill="#eceff2"/>
  <rect x="930" y="230" width="230" height="110" fill="#5b6773" opacity=".55"/>
  <line x1="600" y1="80" x2="600" y2="190" stroke="#c9ced4" stroke-width="5"/>
  <line x1="670" y1="65" x2="670" y2="180" stroke="#c9ced4" stroke-width="5"/>
  <line x1="740" y1="55" x2="740" y2="170" stroke="#c9ced4" stroke-width="5"/>
  <path d="M600 82 q30 10 55 0 v45 q-25 10 -55 0z" fill="#1f4fbf"/>
  <path d="M670 67 q30 10 55 0 v45 q-25 10 -55 0z" fill="#d9302c"/>
  <path d="M670 82 q30 10 55 0 v15 q-25 10 -55 0z" fill="#f2c230"/>
  <path d="M740 57 q30 10 55 0 v45 q-25 10 -55 0z" fill="#1c9a4b"/>
  <path d="M740 72 q30 10 55 0 v15 q-25 10 -55 0z" fill="#ffffff"/>
