    <rect x="300" y="860" width="140" height="70"/>
    <rect x="620" y="880" width="140" height="70"/>
    <rect x="960" y="900" width="140" height="70"/>
  </g>
  <rect x="0" y="1000" width="1200" height="100" fill="#4a4f55"/>
  <rect x="0" y="1060" width="1200" height="14" fill="#f2c230"/>
